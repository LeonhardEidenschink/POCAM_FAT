# isotropy_config.yaml
# ====================
# Edit this file to configure your isotropy run.

# Data paths
paths:
  batch1_data: /home/ecp/disk1/main_pocam_data/batch1/prod_characterization_{hem}/cali_flange_{hem}
  batch2_data: /home/ecp/disk1/main_pocam_data/batch2/prod_characterization_{hem}/cali_flange_{hem}
  output:      ../output/
  
# Measurement settings
settings:
  temp:   25        # temperature [°C]
  coarse: 1         # LMG coarse setting
  fine:   20        # LMG fine setting
  mode:   default   # KAPU mode: 'default' or 'fast'
  pwm:    54000     # power [a.u.]
  target: None      # 'master', 'slave', or 'None'

# Emitters to process for every device listed below.
# Available: LMG365, LMG405, LMG450, LMG520, KAPU405, KAPU465
emitters:
  - LMG450

# Devices: each entry needs an id, two hemispheres, and a batch.    
devices:
    - id: '003'
      hemispheres: ['11', '12']
      batch: batch1
      
    - id: '005'
      hemispheres: ['18', '20']
      batch: batch1
      

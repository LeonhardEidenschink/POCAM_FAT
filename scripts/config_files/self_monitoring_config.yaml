# self_monitoring_config.yaml
# ===========================
# Edit this file to configure your self-monitoring intensity / photon-number run.

# Data paths
# {hem} is replaced by the hemisphere id at runtime
paths:
  data_sm: /home/ecp/disk1/main_pocam_data/{batch}/prod_characterization_{hem}/
  data_abs_cal: ../output/
  output:      ../output/
  cal_prefix: cali_flange_   # calibration file prefix (joined with hemisphere id)

# Measurement settings
settings:
  pwm:    54000     # power [a.u.]
  coarse: 1         # LMG coarse setting
  fine:   20        # LMG fine setting
  mode:   default   # KAPU mode: 'default' or 'fast'
  target:           # '1' or '2'; leave blank to auto-detect from HDF5

# Temperatures to process for every hemisphere/emitter combination.
temperatures:
  - 25
  - 0
  - -20
  - -30
  - -10
  - -40

# Emitters to process for every hemisphere listed below.
# Available: LMG365, LMG405, LMG450, LMG520, KAPU405, KAPU465
emitters:
  - LMG405

# Hemispheres to process.
# Each entry needs:
#   hemisphere  : HDF5 file id (the directory/file name suffix)
#   device_id   : POCAM device number (for output file naming and UIDs)
#   batch       : data batch label
hemispheres:
  - hemisphere: "03"
    device_id:  "002"
    batch:      batch2
